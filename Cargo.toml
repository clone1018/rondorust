[package]
name = "rondorust"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust rondocode synthesis and pattern rendering, with Bevy audio assets"
repository = "https://github.com/clone1018/rondorust"
documentation = "https://docs.rs/rondorust"
license = "MIT"
readme = "README.md"
keywords = ["bevy", "audio", "synthesizer", "rondocode", "music"]
categories = ["game-development", "multimedia::audio"]
include = ["src/**", "tests/**", "examples/**", "assets/**", "README.md", "CONTRIBUTING.md", "LICENSE", "NOTICE.md", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
bevy = ["dep:bevy_app", "dep:bevy_asset", "dep:bevy_audio", "dep:bevy_ecs", "dep:bevy_reflect", "dep:rodio"]

[dependencies]
bevy_app = { version = "0.19", optional = true }
bevy_asset = { version = "0.19", optional = true }
bevy_audio = { version = "0.19", default-features = false, optional = true }
bevy_ecs = { version = "0.19", optional = true }
bevy_reflect = { version = "0.19", optional = true }
rodio = { version = "0.22", default-features = false, optional = true }

[[example]]
name = "bevy"
required-features = ["bevy"]

[[example]]
name = "bevy_player"
required-features = ["bevy"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
